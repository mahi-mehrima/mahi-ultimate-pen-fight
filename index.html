
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10101e">

  <title>Mahi Vortex | Pen Fight</title>
  <meta name="description" content="Mahi Vortex Pen Fight — Made by SK Abdur Rahman Mahi">
  <meta name="author" content="SK Abdur Rahman Mahi">

  <link rel="canonical" href="https://mahi-mehrima.github.io/mahi-ultimate-pen-fight/">
  <meta property="og:title" content="Mahi Vortex | Pen Fight">
  <meta property="og:description" content="Play Pen Fight — Made by SK Abdur Rahman Mahi">
  <meta property="og:url" content="https://mahi-mehrima.github.io/mahi-ultimate-pen-fight/">
  <meta property="og:site_name" content="Mahi Vortex">

  <link rel="icon" href="./favicon.ico">
  <link rel="manifest" href="./manifest.webmanifest">

  <script src="./boot.js"></script>
  <script type="module" crossorigin src="./assets/index-CZKrJOft.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-2uJHwxj2.css">

  <style>
    :root {
      --mv-bg: #10101e;
      --mv-blue: #00c8ff;
      --mv-purple: #a855f7;
      --mv-white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background-color: var(--mv-bg);
      background-image:
        linear-gradient(rgba(8, 8, 20, .42), rgba(8, 8, 20, .58)),
        url("./assets/mahi-vortex-desk.png");
      background-position: center;
      background-size: cover;
      background-attachment: fixed;
      color: var(--mv-white);
    }

    .masthead,
    footer,
    .mv-brand-panel {
      position: relative;
      z-index: 5;
    }

    .masthead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      padding: 14px 20px;
      border-bottom: 2px solid var(--mv-blue);
      background: rgba(8, 8, 20, .86);
    }

    .brand-name-custom {
      display: inline-block;
      color: #fff;
      font-weight: 1000;
      font-size: clamp(22px, 4vw, 38px);
      letter-spacing: 1.5px;
      text-shadow: 0 0 12px var(--mv-purple);
    }

    .edition {
      display: block;
      color: var(--mv-blue);
      font-weight: 800;
      letter-spacing: 3px;
      font-size: 11px;
    }

    .mv-link {
      display: inline-block;
      padding: 10px 16px;
      border: 1px solid var(--mv-blue);
      border-radius: 24px;
      background: #111b47;
      color: #fff;
      text-decoration: none;
      font-weight: 800;
    }

    .mv-link:hover {
      background: #183a70;
      box-shadow: 0 0 15px var(--mv-blue);
    }

    .mv-brand-panel {
      margin: 12px auto;
      padding: 12px;
      text-align: center;
      color: #fff;
      font-weight: 900;
      text-shadow: 0 0 12px var(--mv-purple);
    }

    .mv-brand-panel .mv-title {
      font-size: clamp(24px, 5vw, 42px);
      letter-spacing: 2px;
    }

    .mv-credit {
      margin: 8px 0;
      color: #b9f3ff;
      font-size: 13px;
      letter-spacing: 1px;
    }

    #main-menu,
    #pen-picker,
    .play-area,
    .intro,
    footer {
      position: relative;
      z-index: 1;
    }

    #main-menu,
    #pen-picker,
    .play-area {
      background-color: rgba(10, 10, 25, .20);
    }

    #arena {
      position: relative;
      background-color: rgba(36, 24, 16, .18);
      background-image:
        linear-gradient(rgba(20, 10, 5, .08), rgba(20, 10, 5, .08)),
        url("./assets/mahi-vortex-desk.png");
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
      border-radius: 12px;
      overflow: hidden;
    }

    footer {
      padding: 18px 12px;
      text-align: center;
      background: rgba(8, 8, 20, .9);
      border-top: 2px solid var(--mv-purple);
    }

    footer p {
      margin: 8px 0;
    }

    .mv-footer-brand {
      color: white;
      font-size: 18px;
      font-weight: 1000;
      letter-spacing: 2px;
    }

    .mv-credit-footer {
      color: #b9f3ff;
      font-size: 13px;
      font-weight: 700;
    }

    @media (max-width: 600px) {
      .masthead {
        padding: 12px;
      }

      .mv-link {
        padding: 8px 12px;
        font-size: 12px;
      }

      body {
        background-attachment: scroll;
      }
    }
  </style>
</head>

<body>
  <noscript>
    <h2>Mahi Vortex</h2>
    <p>This game needs JavaScript enabled.</p>
  </noscript>

  <main>
    <header class="masthead">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div>
          <span class="brand-name-custom" data-i18n="brand.name">Mahi Vortex</span>
          <span class="edition" data-i18n="brand.edition">MAHI VORTEX EDITION</span>
        </div>
      </div>

      <div class="header-actions">
        <a class="mv-link"
           href="https://www.facebook.com/mahi04rotna"
           target="_blank"
           rel="noopener noreferrer">Facebook ↗</a>

        <span class="mode"></span>

        <button id="settings-toggle" class="gear-pill" type="button"
          aria-haspopup="dialog" aria-expanded="false"
          aria-controls="settings-panel" data-i18n-label="settings.open">
          <span data-icon="settings" aria-hidden="true"></span>
        </button>
      </div>
    </header>

    <div class="mv-brand-panel">
      <div class="mv-title">MAHI VORTEX</div>
      <div>PEN FIGHT · FLICK · FIGHT · WIN</div>
      <div class="mv-credit">Made by SK Abdur Rahman Mahi</div>
      <a class="mv-link"
         href="https://www.facebook.com/mahi04rotna"
         target="_blank"
         rel="noopener noreferrer">Follow Mahi Vortex on Facebook ↗</a>
    </div>

    <section class="intro" data-i18n-label="intro.label">
      <div>
        <p class="eyebrow" data-i18n="intro.eyebrow"></p>
        <h1 data-i18n="intro.title">Mahi Vortex</h1>
      </div>
      <p class="intro-note" data-i18n="intro.note"></p>
    </section>

    <section id="main-menu"></section>
    <section id="pen-picker" hidden data-i18n-label="pick.roster"></section>

    <section class="play-area" data-i18n-label="game.label" hidden>
      <div class="game-bar">
        <span id="turn-pill" class="turn-pill" data-player="0">
          <span data-icon="pen" aria-hidden="true"></span>
          <span class="turn-copy"><span id="turn-label"></span></span>
        </span>

        <p id="turn-hint" class="turn-hint" aria-hidden="true"></p>
        <span id="status" role="status" aria-live="polite"></span>
        <span class="hot-seat" data-i18n="hud.hotSeat"></span>

        <button id="pause-button" class="pause-key" type="button"
          aria-haspopup="dialog" data-i18n-label="pause.open">
          <span data-icon="pause" aria-hidden="true"></span>
        </button>
      </div>

      <div id="arena">
        <p id="loading" data-i18n="game.loading">Loading Mahi Vortex...</p>
      </div>

      <p id="handoff" class="handoff" aria-hidden="true"></p>
      <p id="desk-banner" class="desk-banner" aria-hidden="true"></p>
      <div id="result" class="result" hidden></div>
      <div class="game-bottom" role="group" data-i18n-label="board.label"></div>
    </section>

    <footer>
      <div class="mv-footer-brand">MAHI VORTEX</div>
      <p>
        <b data-step="1"></b> <span data-i18n="controls.hold"></span>
        <b data-step="2"></b> <span data-i18n="controls.aim"></span>
        <b data-step="3"></b> <span data-i18n="controls.release"></span>
      </p>
      <p data-i18n="controls.tip"></p>
      <p class="mv-credit-footer">Made by SK Abdur Rahman Mahi</p>
      <a class="mv-link"
         href="https://www.facebook.com/mahi04rotna"
         target="_blank"
         rel="noopener noreferrer">Facebook: Mahi Vortex ↗</a>
    </footer>
  </main>

  <div id="desk-loader" class="desk-loader" role="progressbar"
    aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"
    aria-labelledby="desk-loader-text" hidden>
    <div class="loader-card">
      <span class="loader-mark" aria-hidden="true"></span>
      <span class="loader-pen" aria-hidden="true"></span>
      <p id="desk-loader-text" data-i18n="loader.text"></p>
    </div>
  </div>

  <div id="boot-splash" class="boot-splash" aria-hidden="true">
    <div class="boot-card">
      <p></p>
      <span class="update-bar"><i></i></span>
    </div>
  </div>

  <script>
    document.title = "Mahi Vortex | Pen Fight";

    function setMahiVortexBrand() {
      const brand = document.querySelector('[data-i18n="brand.name"]');
      if (brand) brand.textContent = "Mahi Vortex";

      const edition = document.querySelector('[data-i18n="brand.edition"]');
      if (edition) edition.textContent = "MAHI VORTEX EDITION";

      const heading = document.querySelector(".intro h1");
      if (heading) heading.textContent = "Mahi Vortex";

      const loading = document.getElementById("loading");
      if (loading && loading.textContent.includes("Loading")) {
        loading.textContent = "Loading Mahi Vortex...";
      }
    }

    setMahiVortexBrand();

    new MutationObserver(setMahiVortexBrand).observe(
      document.documentElement,
      {
        childList: true,
        subtree: true
      }
    );
  </script>
</body>
</html>
