      <div style="max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1.1rem/1.5 system-ui, sans-serif;">
        <h2>Pen Fight</h2>
        <p>Pen Fight is a free flick game for the browser from Mahi Vortex. Two pens lie on a school desk: flick yours, knock the other pen off and keep yours on. Play the computer or a friend on the same phone, tablet or computer. No sign-in, no ads.</p>
        <p>How to play:</p>
        <ol>
          <li>Grab your pen.</li>
          <li>Pull back to aim. Pull further for more power, grab near a tip to spin.</li>
          <li>Let go to flick. Knock their pen off the desk and keep yours on to win.</li>
        </ol>
        <p>Pen Fight needs JavaScript. Turn it on to play, or see <a href="/games/">all Mahi Vortex games</a>.</p>
      </div>
